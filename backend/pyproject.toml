[project]
name = "boke-n-backend"
version = "0.1.0"
description = "boke-N blog API on Cloudflare Python Workers + D1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "bcrypt",
    "pyjwt",
    "pydantic",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn",
    "httpx",
    "pytest",
]

# pywrangler reads [project].dependencies and packages them for Workers deploy.
# Run: uv sync && uv run pywrangler dev | deploy
