<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博客管理后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>博客管理后台</h1>
      <div class="toolbar">
        <span id="adminCurrentUser"></span>
        <button id="adminLogoutBtn" class="secondary">退出登录</button>
      </div>
    </header>

    <main class="layout">
      <aside class="left-panel">
        <h2>菜单</h2>
        <button data-section="roles">角色管理</button>
        <button data-section="users">用户管理</button>
        <button data-section="resources">资源管理</button>
        <button data-section="articles">文章管理</button>
        <button data-section="bannedWords">违禁词管理</button>
        <button data-section="comments">评论记录管理</button>
      </aside>

      <section class="content-panel">
        <section class="card" id="adminLoginPanel">
          <h2>管理员登录</h2>
          <form id="adminLoginForm" class="form-grid">
            <label>
              用户名
              <input name="username" value="admin" required />
            </label>
            <label>
              密码
              <input name="password" type="password" value="Admin123!" required />
            </label>
            <button type="submit">登录</button>
          </form>
          <p class="tip">默认管理员账号：admin / Admin123!</p>
        </section>

        <section class="card hidden" id="adminDataPanel">
          <div class="section-header">
            <h2 id="sectionTitle">角色管理</h2>
            <button id="refreshBtn" class="secondary">刷新</button>
          </div>
          <form id="entityForm" class="form-grid"></form>
          <div class="table-wrap">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
